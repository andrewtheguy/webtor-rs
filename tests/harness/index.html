<!doctype html>
<meta charset="utf-8" />
<title>webtor-wasm harness</title>
<pre id="log"></pre>
<script type="module">
  // The page half of the test project. It holds the objects that cannot cross
  // the CDP boundary — the client and its sockets live here, keyed by id — and
  // exposes only plain JSON to the Node side.
  import init, {
    WebtorClient,
    describeDirectory,
    isOnionHost,
    parseOnionUrl,
  } from '/webtor-wasm/pkg/webtor_wasm.js';

  const logElement = document.getElementById('log');
  const state = {
    client: null,
    sockets: new Map(),
    nextSocket: 0,
    service: null,
    served: [],
    directoryUpdates: [],
  };

  function show(line) {
    logElement.textContent += `${line}\n`;
  }

  /**
   * The WASM bindings reject with plain strings, not `Error`s, and a bare
   * string loses its message on the way across CDP. Re-throwing as an `Error`
   * is what lets a test assert on what went wrong.
   */
  async function rethrowing(work) {
    try {
      return await work();
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      show(`error: ${message}`);
      throw new Error(message);
    }
  }

  function socket(id) {
    const found = state.sockets.get(id);
    if (!found) throw new Error(`No socket ${id}; it may already be closed`);
    return found;
  }

  function service() {
    if (!state.service) throw new Error('No onion service; call servicePublish first');
    return state.service;
  }

  function client() {
    if (!state.client) throw new Error('No client; call create first');
    return state.client;
  }

  // Top-level await: the harness only appears once the module is usable, and
  // the Node side waits for it, so no test can race the instantiation.
  await init();

  globalThis.harness = {
    // --- no client needed -------------------------------------------------
    isOnionHost: (host) => isOnionHost(host),
    parseOnionUrl: (url) => rethrowing(async () => parseOnionUrl(url)),
    createRejects: (options) =>
      rethrowing(async () => {
        const created = await WebtorClient.create(options);
        await created.close();
        return 'created';
      }),
    /**
     * The same, with an `onLog` callback added here. A function cannot travel
     * through CDP, so the sink a caller would supply is made in the page.
     */
    createRejectsWithLogger: (options) =>
      rethrowing(async () => {
        const created = await WebtorClient.create({ ...options, onLog: () => {} });
        await created.close();
        return 'created';
      }),
    /**
     * Bootstrap with a sink of the page's own and return the lines it was
     * given. Whether the bootstrap succeeds is beside the point — the caller's
     * function either receives webtor's progress or it does not.
     */
    createLogging: (options) =>
      rethrowing(async () => {
        const lines = [];
        try {
          const created = await WebtorClient.create({
            ...options,
            onLog: (message, level) => lines.push(`${level}: ${message}`),
          });
          await created.close();
        } catch {
          // The failure is expected; the lines leading to it are what is asked
          // for.
        }
        return lines;
      }),
    /**
     * Read a seed's own account of itself. `instants` are epoch milliseconds
     * to place in time periods, which is how the boundary a caller cares
     * about is asserted from the Node side.
     */
    describeDirectory: (seed, instants = []) =>
      rethrowing(async () => {
        const described = describeDirectory(seed);
        return {
          validAfter: described.validAfter.toISOString(),
          validUntil: described.validUntil.toISOString(),
          timePeriod: described.timePeriod,
          periods: instants.map((at) => described.timePeriodAt(at)),
        };
      }),

    // --- client lifecycle -------------------------------------------------
    /**
     * Bootstrap a client. `seedUrl` is fetched in the page rather than passed
     * in as an argument: a directory snapshot is tens of megabytes and does
     * not want to travel through CDP.
     */
    create: (options, seedUrl) =>
      rethrowing(async () => {
        const started = performance.now();
        const settings = { ...options };
        if (seedUrl) {
          const response = await fetch(seedUrl);
          if (!response.ok) {
            throw new Error(`Seed ${seedUrl} answered HTTP ${response.status}`);
          }
          settings.directorySeed = await response.text();
        }
        // Recorded, not returned: a seed is tens of megabytes, so what
        // crosses CDP is what `directoryUpdates` says about it.
        settings.onDirectoryChange = (seed) => {
          state.directoryUpdates.push(seed);
          show(`directory update: ${seed.length} bytes`);
        };
        state.client = await WebtorClient.create(settings);
        return { seconds: Number(((performance.now() - started) / 1000).toFixed(1)) };
      }),

    /** Every directory `onDirectoryChange` was handed, described. */
    directoryUpdates: () =>
      rethrowing(async () =>
        state.directoryUpdates.map((seed) => ({
          bytes: seed.length,
          timePeriod: describeDirectory(seed).timePeriod,
        })),
      ),

    directoryCache: () =>
      rethrowing(async () => {
        const encoded = await client().directoryCache();
        const parsed = JSON.parse(encoded);
        const described = describeDirectory(encoded);
        return {
          bytes: encoded.length,
          version: parsed.version,
          consensusBytes: parsed.consensus.length,
          certificateBytes: parsed.certificates.length,
          microdescriptorBytes: parsed.microdescriptors.length,
          validUntil: described.validUntil.toISOString(),
          timePeriod: described.timePeriod,
          timePeriodNow: described.timePeriodAt(Date.now()),
        };
      }),

    close: () =>
      rethrowing(async () => {
        await client().close();
        return 'closed';
      }),

    // --- HTTP -------------------------------------------------------------
    fetch: (url, options) =>
      rethrowing(async () => {
        const started = performance.now();
        const response = await client().fetch(url, options);
        const bytes = response.bytes();
        let text = null;
        try {
          text = response.text();
        } catch {
          // A body that is not UTF-8 is still a valid response; the test that
          // cares reads `byteLength` instead.
        }
        return {
          status: response.status,
          ok: response.ok,
          headers: response.headers,
          byteLength: bytes.length,
          text,
          seconds: Number(((performance.now() - started) / 1000).toFixed(1)),
        };
      }),

    // --- WebSocket --------------------------------------------------------
    wsOpen: (url, options) =>
      rethrowing(async () => {
        const started = performance.now();
        const opened = await client().connectWebSocket(url, options);
        const id = state.nextSocket++;
        state.sockets.set(id, opened);
        return {
          id,
          seconds: Number(((performance.now() - started) / 1000).toFixed(1)),
        };
      }),

    wsSend: (id, text) =>
      rethrowing(async () => {
        await socket(id).send(text);
        return 'sent';
      }),

    wsSendBinary: (id, bytes) =>
      rethrowing(async () => {
        await socket(id).sendBinary(new Uint8Array(bytes));
        return 'sent';
      }),

    /** One message, as `{type, text}` / `{type, bytes}`, or `null` on close. */
    wsReceive: (id) =>
      rethrowing(async () => {
        const message = await socket(id).receive();
        if (message == null) return null;
        return message.type === 'binary'
          ? { type: 'binary', bytes: Array.from(message.bytes) }
          : { type: 'text', text: message.text };
      }),

    /**
     * Read until a message satisfies `pattern` (a JSON-encoded array whose
     * first element is matched against the message's), or `limit` messages
     * have gone by. Returns everything read.
     */
    wsReceiveUntil: (id, kinds, limit) =>
      rethrowing(async () => {
        const seen = [];
        for (let count = 0; count < limit; count++) {
          const message = await socket(id).receive();
          if (message == null) return { closed: true, seen };
          const text = message.type === 'text' ? message.text : null;
          seen.push(text ?? `<${message.bytes.length} bytes>`);
          if (text && kinds.some((kind) => text.startsWith(`["${kind}"`))) {
            return { closed: false, matched: text, seen };
          }
        }
        return { closed: false, seen };
      }),

    // --- raw onion streams ------------------------------------------------
    /**
     * Open a raw stream to an onion address, send one line and return the
     * line that comes back. This is what talks to a service that speaks
     * something other than HTTP.
     */
    streamExchange: (address, port, message) =>
      rethrowing(async () => {
        const started = performance.now();
        const stream = await client().connectStream(address, port);
        try {
          await stream.send(`${message}\n`);
          const decoder = new TextDecoder();
          let reply = '';
          while (!reply.includes('\n')) {
            const chunk = await stream.receive();
            if (chunk == null) break;
            reply += decoder.decode(chunk, { stream: true });
          }
          return {
            reply: reply.replace(/\r?\n$/, ''),
            seconds: Number(((performance.now() - started) / 1000).toFixed(1)),
          };
        } finally {
          await stream.close().catch(() => {});
        }
      }),

    // --- onion service ----------------------------------------------------
    /** Publish a service from this page and return its address. */
    servicePublish: (options) =>
      rethrowing(async () => {
        const started = performance.now();
        state.service = await client().publishOnionService(options);
        return {
          address: state.service.onionAddress,
          seconds: Number(((performance.now() - started) / 1000).toFixed(1)),
        };
      }),

    /**
     * Answer every stream the service receives with one HTTP/1.1 response,
     * recording the request line. Runs until the service is closed, so it is
     * started and left alone rather than awaited.
     */
    serviceServeHttp: (body) =>
      rethrowing(async () => {
        const decoder = new TextDecoder();
        const running = service();
        (async () => {
          for (;;) {
            const stream = await running.accept();
            if (stream == null) return;
            (async () => {
              try {
                let request = '';
                while (!request.includes('\r\n\r\n')) {
                  const chunk = await stream.receive();
                  if (chunk == null) break;
                  request += decoder.decode(chunk, { stream: true });
                }
                const line = request.split('\r\n', 1)[0] ?? '';
                state.served.push(line);
                show(`served ${line}`);
                await stream.send(
                  `HTTP/1.1 200 OK\r\n` +
                    `Content-Type: text/plain\r\n` +
                    // Bytes, not code units: a non-ASCII body would otherwise
                    // be cut short by whatever read the header.
                    `Content-Length: ${new TextEncoder().encode(body).length}\r\n` +
                    `Connection: close\r\n\r\n${body}`,
                );
              } catch (error) {
                show(`serve failed: ${error}`);
              } finally {
                await stream.close().catch(() => {});
              }
            })();
          }
        })();
        return 'serving';
      }),

    /**
     * Echo every line back, the way `ptransfer tor serve` does, so a CLI
     * client can talk to a service this page runs. Runs until the service is
     * closed.
     */
    serviceServeEcho: () =>
      rethrowing(async () => {
        const decoder = new TextDecoder();
        const running = service();
        (async () => {
          for (;;) {
            const stream = await running.accept();
            if (stream == null) return;
            (async () => {
              try {
                let pending = '';
                for (;;) {
                  const chunk = await stream.receive();
                  if (chunk == null) break;
                  pending += decoder.decode(chunk, { stream: true });
                  let split;
                  while ((split = pending.indexOf('\n')) >= 0) {
                    const line = pending.slice(0, split);
                    pending = pending.slice(split + 1);
                    state.served.push(line);
                    show(`echoing ${line.length} byte(s)`);
                    await stream.send(`${line}\n`);
                  }
                }
              } catch (error) {
                show(`echo failed: ${error}`);
              } finally {
                await stream.close().catch(() => {});
              }
            })();
          }
        })();
        return 'echoing';
      }),

    /** The request lines the service has answered so far. */
    serviceRequests: () => state.served.slice(),

    serviceStop: () =>
      rethrowing(async () => {
        await service().close();
        state.service = null;
        return 'closed';
      }),

    wsClose: (id) =>
      rethrowing(async () => {
        await socket(id).close();
        state.sockets.delete(id);
        return 'closed';
      }),
  };

  show('harness ready');
</script>
