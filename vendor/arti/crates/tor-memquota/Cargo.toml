[package]
name = "tor-memquota"
version = "0.37.0"
authors = ["The Tor Project, Inc.", "Ian Jackson <iwj@torproject.org>"]
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Memory use tracking and quota utilities, used by Tor software"
keywords = ["tor", "arti"]
categories = ["memory-management"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[dependencies]
derive-deftly = { version = "~1.5.0", features = ["full", "beta"] }
derive_more = { version = "2.0.1", features = ["full"] }
educe = "0.4.22"
futures = "0.3.14"
itertools = "0.14.0"
paste = "1"
pin-project = "1"
thiserror = "2"
tor-async-utils = { path = "../tor-async-utils", version = "0.37.0" }
tor-error = { path = "../tor-error", version = "0.37.0", features = ["tracing"] }
tor-rtcompat = { version = "0.37.0", path = "../tor-rtcompat" }

[features]
full = []
default = []
memquota = []
testing = []
experimental = []
__is_experimental = []
