# Its own workspace, deliberately: see README.md. The root workspace excludes
# `reference/`, and this project shares neither a Cargo.lock nor a dependency
# version with the crates it is meant to be an independent check on.
[workspace]

[package]
name = "onion-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "Arti-based onion-service peer webtor is tested against"

[[bin]]
name = "onion-cli"
path = "src/main.rs"
