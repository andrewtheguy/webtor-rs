[workspace]
members = [
    "webtor",
    "webtor-wasm"
]
resolver = "2"

[workspace.package]
version = "0.5.14"
edition = "2021"
authors = ["Webtor Contributors"]
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.69", features = [
    "console",
    "Window",
    "Event",
    "MessageEvent",
    # Browser WebSocket features for the retained future Snowflake path
    "WebSocket",
    "BinaryType",
    "ErrorEvent",
    "CloseEvent",
    # WebRTC features for the Snowflake client transport
    "RtcPeerConnection",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcIceGatheringState",
    "RtcDataChannelType",
    # HTTP fetch features for the Snowflake broker
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    # Performance API for timing
    "Performance"
] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
futures = "0.3"
# Debug and trace strings are compiled out of release builds.
tracing = { version = "0.1", features = ["release_max_level_info"] }

# Tor-related dependencies (Arti 2.5.1)
tor-rtcompat = { version = "0.45.0", default-features = false }
tor-general-addr = "0.45.0"
tor-proto = { version = "0.45.0", default-features = false, features = ["hs-client", "send-control-msg"] }
tor-netdoc = { version = "0.45.0", default-features = false, features = ["hs-client"] }
tor-linkspec = { version = "0.45.0", features = ["decode", "verbatim"] }
tor-cell = { version = "0.45.0", features = ["hs"] }
tor-hscrypto = "0.45.0"
tor-checkable = "0.45.0"
tor-bytes = "0.45.0"
tor-llcrypto = "0.45.0"
tor-memquota = { version = "0.45.0", default-features = false }
tor-protover = "0.45.0"
tor-units = "0.45.0"
safelog = "0.9.0"

# Cryptography
hex = "0.4"
base64 = "0.22"

# WASM utilities
gloo-timers = { version = "0.3", features = ["futures"] }

# KCP reliable transport
kcp = "0.6"

# Release profile optimized for WASM bundle size
[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Full LTO for better dead code elimination
codegen-units = 1      # Single codegen unit for better optimization
strip = "debuginfo"    # Strip debug info but keep symbols for wasm-bindgen
panic = "abort"        # Smaller binary, no unwinding overhead
debug = 0              # No debug info
