[package]
name = "webtor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core Tor client implementation for web browsers"

[dependencies]
# Async locks (no runtime needed)
async-lock = "3"
async-trait = "0.1"
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Tor protocol implementation
tor-rtcompat = { workspace = true }
tor-general-addr = { workspace = true }
tor-proto = { workspace = true }
tor-protover = { workspace = true }
tor-units = { workspace = true }
tor-netdoc = { workspace = true }
tor-linkspec = { workspace = true }
tor-cell = { workspace = true }
tor-hscrypto = { workspace = true }
tor-bytes = { workspace = true }
tor-llcrypto = { workspace = true }
tor-memquota = { workspace = true }
safelog = { workspace = true }
wasm-bindgen-futures = { workspace = true }

# Cryptography
hex = { workspace = true }
base64 = { workspace = true }

# Networking

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# Compression
flate2 = "1.0"
rand = { version = "0.10", features = ["std", "std_rng"] }
digest = "0.10"
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
tor-checkable = { workspace = true }

# KCP reliable transport
kcp = { workspace = true }

# WASM utilities
gloo-timers = { workspace = true }

# WASM TLS (SubtleCrypto-based)
subtle-tls = { path = "../subtle-tls" }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "macros"] }
